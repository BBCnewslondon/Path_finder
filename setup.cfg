[metadata]
name = delivery-route-optimizer
version = 1.0.0
author = Jules
author_email = jules@example.com
description = A Python application that finds the shortest delivery routes for multiple addresses.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/example/delivery-route-optimizer
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires = file: requirements.txt

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    delivery-optimizer = main:main

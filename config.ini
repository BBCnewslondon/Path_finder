[api_keys]
# Add your API keys here. They will be used if not set as environment variables.
OPENROUTESERVICE_API_KEY = your_key_here
GOOGLE_MAPS_API_KEY = your_key_here

[optimization]
# Default algorithm to use for optimization.
# Options: nearest_neighbor, 2opt, ortools, genetic
default_algorithm = 2opt

# Default optimization metric.
# Options: distance, time
default_optimize_by = distance

[genetic_algorithm]
# Parameters for the genetic algorithm.
population_size = 100
generations = 500

[defaults]
# Default output filenames
map_output_file = route_map.html
results_output_file = route_results.json
